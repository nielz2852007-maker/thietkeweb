<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Htaiels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Bố cục: bản đồ 12 thì (3 cột thời gian x 4 hàng dạng thì) làm trung tâm; mỗi ô có vòng tiến độ. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface2:#E8ECF5; --ink:#0F1A35; --muted:#566180; --line:#D3DAE8; --track:#DCE2EF;
  --past:#C25E00; --past-soft:#FDEBD6;
  --pres:#1F5FE0; --pres-soft:#DCE8FF;
  --fut:#7027DB; --fut-soft:#EBE0FF;
  --good:#12763A; --good-soft:#DCF3E3;
  --bad:#B42323; --bad-soft:#FBE1E1;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A0F1F; --surface:#131A31; --surface2:#1C2544; --ink:#E9EDFA; --muted:#9AA6C8; --line:#29345A; --track:#26315A;
    --past:#FFAA57; --past-soft:#3A2813;
    --pres:#7AA8FF; --pres-soft:#162A58;
    --fut:#BBA2FF; --fut-soft:#2B2158;
    --good:#4FDB86; --good-soft:#12361F;
    --bad:#FF8383; --bad-soft:#3C1919;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pres);outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;flex-wrap:wrap}
.brand{font:800 26px/1 var(--display);letter-spacing:-.03em}
.brand em{font-style:normal;color:var(--pres)}
.stats{display:flex;gap:8px;flex-wrap:wrap;font:600 12px/1 var(--mono)}
.stats span{background:var(--surface);border:1px solid var(--line);padding:6px 9px;border-radius:99px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:99px;font-weight:600;color:var(--muted);white-space:nowrap}
nav button.on{background:var(--ink);color:var(--bg)}
nav button:hover:not(.on){background:var(--surface2)}
main{padding-block:22px 60px}

/* thành phần chung */
.btn{border:0;background:var(--ink);color:var(--bg);padding:13px 22px;border-radius:12px;font-weight:700;min-height:48px}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn.sm{padding:8px 14px;min-height:38px;border-radius:10px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.label{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--soft,var(--surface2));color:var(--c,var(--ink))}
.t-past{--c:var(--past);--soft:var(--past-soft)}
.t-present{--c:var(--pres);--soft:var(--pres-soft)}
.t-future{--c:var(--fut);--soft:var(--fut-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:16px}
.muted{color:var(--muted)}
.notice{background:var(--pres-soft);color:var(--pres);padding:12px 16px;border-radius:12px;font-weight:600}

/* trang chủ */
.hero{display:grid;gap:18px;margin-bottom:22px}
.hero h1{font-size:clamp(32px,6.4vw,56px);max-width:16ch}
.hero p{color:var(--muted);max-width:52ch}
.goal{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px}
.goal .prog{width:160px}
.prog{height:10px;background:var(--track);border-radius:99px;overflow:hidden;flex:1;min-width:60px}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s}
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.colh{font:800 14px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-radius:10px;background:var(--soft);color:var(--c)}
.cell{display:grid;gap:6px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;min-width:0;transition:transform .15s,border-color .15s}
.cell:hover{border-color:var(--c);transform:translateY(-2px)}
.cell b{font:700 14px/1.2 var(--display);overflow-wrap:anywhere}
.cell i{font-style:normal;font-size:12px;color:var(--muted);line-height:1.2}
.ring{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center}
.ring span{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:600 11px var(--mono)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* luyện tập */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:96px}
.mode:hover{border-color:var(--ink)}
.mode b{font:700 18px var(--display)}
.mode span{color:var(--muted);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:99px;font-weight:600;font-size:14px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.pill{padding-right:8px}

/* phiên luyện */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sbar .mono{font-size:13px;color:var(--muted)}
.timer{font-weight:600;color:var(--ink)!important;background:var(--surface);border:1px solid var(--line);padding:6px 10px;border-radius:99px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,34px);display:grid;gap:20px}
.sentence{font:500 clamp(20px,3.6vw,28px)/2 var(--body)}
.sentence b.hl{color:var(--c,var(--pres));background:var(--soft,var(--pres-soft));padding:2px 8px;border-radius:8px}
.cue{font-family:var(--mono);font-size:.7em;color:var(--muted);background:var(--surface2);padding:2px 8px;border-radius:8px;white-space:nowrap}
.blank{font:inherit;color:var(--ink);background:var(--surface2);border:0;border-bottom:3px solid var(--ink);border-radius:8px 8px 0 0;padding:0 10px;text-align:center;min-width:7ch;max-width:100%}
.blank.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.blank.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.hint{font-size:14px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 14px}
.hint code,.fb code{font-family:var(--mono);font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;font-weight:600;min-height:54px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tray{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tok{border:0;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;font-size:17px}
.tok.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .full{color:var(--ink);font-weight:600}
.fb .why{color:var(--ink);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.irr{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px;align-items:end}
.irr label{display:grid;gap:4px;font:600 12px var(--mono);color:var(--muted)}
.irr input{font:500 20px var(--body);border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;width:100%;color:var(--ink)}
.irr input.ok{border-color:var(--good);background:var(--good-soft)}
.irr input.bad{border-color:var(--bad);background:var(--bad-soft)}
.v1 b{font:800 30px var(--display);display:block}
.v1 span{color:var(--muted);font-size:14px}
.flash{border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:28px;min-height:260px;text-align:left;display:grid;align-content:center;gap:12px;width:100%}
.flash:hover{border-color:var(--ink)}
.flash h2{font-size:clamp(28px,6vw,44px)}
.flash .f{font-family:var(--mono);font-size:15px;background:var(--surface2);padding:8px 12px;border-radius:10px}
.flash ul{margin:0;padding-left:20px;color:var(--muted)}

/* kết quả */
.score{font:800 clamp(56px,14vw,104px)/1 var(--display);letter-spacing:-.04em}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.item small{display:block;color:var(--muted)}

/* lý thuyết */
.tchips{display:flex;gap:6px;flex-wrap:wrap}
.tchip{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:99px;font-weight:600;font-size:13px}
.tchip.on{background:var(--c);color:var(--bg);border-color:var(--c)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.panel header{background:var(--soft);color:var(--c);padding:20px 22px}
.panel header h2{font-size:clamp(26px,5vw,38px)}
.panel header span{font:600 13px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.panel section{padding:18px 22px;border-top:1px solid var(--line);display:grid;gap:10px}
.formula{display:grid;grid-template-columns:34px 1fr;gap:8px 10px;align-items:center;font-family:var(--mono);font-size:15px}
.formula i{font-style:normal;font-weight:700;color:var(--c);background:var(--soft);border-radius:8px;text-align:center;padding:2px 0}
.panel ul{margin:0;padding-left:20px;display:grid;gap:4px}
.sig{display:flex;gap:6px;flex-wrap:wrap}
.sig span{background:var(--surface2);padding:3px 10px;border-radius:8px;font-family:var(--mono);font-size:13px}
.ex{border-left:4px solid var(--c);padding-left:12px}
.ex b{display:block;font-weight:600}
.ex small{color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.m{font-family:var(--mono);font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--track);margin-right:6px}
.dot.on{background:var(--good)}
.search{font:inherit;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;width:100%;max-width:360px;color:var(--ink)}

/* tiến độ */
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.barrow .prog i{background:var(--c)}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.num{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.num b{font:800 32px var(--display);display:block}
.num span{color:var(--muted);font-size:13px}
h2.sec{font-size:22px;margin:30px 0 12px}

@media (max-width:560px){
  .irr{grid-template-columns:1fr 1fr}.irr .v1{grid-column:1/-1}
  .barrow{grid-template-columns:1fr 44px}.barrow .prog{grid-column:1/-1;order:3}
  .cell{padding:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

{id:"pp",time:"present",vi:"Hiện tại hoàn thành",en:"Present Perfect",f:["S + have/has + V3/ed","S + have/has not + V3/ed","Have/Has + S + V3/ed?"],use:["Hành động bắt đầu trong quá khứ, kéo dài đến hiện tại","Hành động vừa xảy ra, kết quả còn ở hiện tại","Trải nghiệm trong đời, không nói rõ thời điểm"],sig:["already","yet","just","ever","never","since","for","so far","recently"],ex:[["I have lived here since 2015.","Tôi sống ở đây từ năm 2015."],["She has already finished her homework.","Cô ấy đã làm xong bài tập rồi."]]},
{id:"fp",time:"future",vi:"Tương lai hoàn thành",en:"Future Perfect",f:["S + will have + V3/ed","S + will not have + V3/ed","Will + S + have + V3/ed?"],use:["Hành động sẽ hoàn thành trước một thời điểm hoặc một hành động khác trong tương lai"],sig:["by + mốc thời gian","by the time","before","by next month"],ex:[["By 2030, I will have graduated from university.","Đến năm 2030, tôi sẽ tốt nghiệp đại học xong rồi."],["She will have finished the report by Friday.","Cô ấy sẽ hoàn thành báo cáo trước thứ Sáu."]]},

/* ===== lưu trữ ===== */
const KEY="thi-lab-v1";
function fresh(){return{xp:0,streak:0,last:"",day:"",today:0,st:{},wrong:[],irr:{},best:0,tot:0,ok:0};}
let S=fresh();
function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function dayKey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function bump(){
  const now=new Date(),k=dayKey(now);
  if(S.day!==k){S.day=k;S.today=0;}
  if(S.last!==k){const y=new Date(now);y.setDate(y.getDate()-1);S.streak=(S.last===dayKey(y))?S.streak+1:1;S.last=k;}
  S.today++;
}
function rec(id,ok,irr){
  const m=irr?S.irr:S.st;
  const e=m[id]||(m[id]={c:0,w:0,s:0});
  if(ok){e.c++;e.s++;S.ok++;}else{e.w++;e.s=0;}
  S.tot++;bump();
  if(!irr){const i=S.wrong.indexOf(id);if(ok){if(i>-1)S.wrong.splice(i,1);}else if(i<0)S.wrong.push(id);}
}

/* ===== tiện ích ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().replace(/[‘’`]/g,"'").replace(/\s+/g," ").trim();
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function full(q){return q.s.replace(/\s*\([^)]*\)/,"").replace("___",q.a[0]);}
function scoped(sc){return QL.filter(q=>sc==="all"||q.t===sc||TM[q.t].time===sc);}
const mq=q=>{const e=S.st[q.id];return !!e&&e.s>=2;};
const mi=v=>{const e=S.irr[v.id];return !!e&&e.s>=2;};
function pick(pool,n,mf){return pool.map(x=>({x:x,k:(mf(x)?1:0)+Math.random()})).sort((a,b)=>a.k-b.k).slice(0,n).map(o=>o.x);}
function mastery(sc){const l=scoped(sc);return l.length?Math.round(l.filter(mq).length/l.length*100):0;}
function fmt(s){s=Math.max(0,s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const canSpeak=()=>typeof window!=="undefined"&&"speechSynthesis" in window;
function speakBtn(t){return canSpeak()?`<button class="btn ghost sm" data-act="speak" data-t="${esc(t)}">Nghe câu</button>`:"";}

const ui={view:"home",tense:"pas",scope:"all",len:10,q:"",msg:"",rs:false};
let ses=null;
const SCOPES=[["all","Tất cả"],["past","Quá khứ"],["present","Hiện tại"],["future","Tương lai"]];

function exit(){if(ses&&ses.timer)clearInterval(ses.timer);ses=null;}

/* ===== phiên luyện tập ===== */
function startSes(m){
  exit();ui.msg="";
  const n=ui.len;let items=[],mode=m;
  if(m==="fill"||m==="id"||m==="order")items=pick(scoped(ui.scope),n,mq);
  else if(m==="exam"){items=pick(QL,20,mq);mode="fill";}
  else if(m==="review"){items=S.wrong.map(i=>QM[i]).filter(Boolean).slice(0,n);mode="fill";}
  else if(m==="flashT"){items=T.filter(t=>ui.scope==="all"||t.id===ui.scope||t.time===ui.scope);mode="flashT";}
  else if(m==="irr"||m==="flashI")items=pick(IL,n,mi);
  if(!items.length){ui.msg="Chưa có câu sai nào để ôn. Hãy luyện thêm vài câu trước.";render();return;}
  ses={src:m,mode:mode,exam:m==="exam",items:items,i:0,ok:0,bad:[],xp:0,total:items.length,left:m==="exam"?900:0,done:false,
       checked:false,good:false,hint:false,val:"",flip:false,sel:-1,flash:mode==="flashT"||mode==="flashI"};
  if(ses.exam)ses.timer=setInterval(tick,1000);
  prep();render();
}
function prep(){
  const it=ses.items[ses.i];
  ses.checked=false;ses.hint=false;ses.val="";ses.flip=false;ses.sel=-1;ses.v2="";ses.v3="";
  if(!it)return;
  if(ses.mode==="id"){
    const others=shuffle(T.filter(t=>t.id!==it.t)).slice(0,3);
    ses.opts=shuffle(others.concat([TM[it.t]])).map(t=>t.id);
  }
  if(ses.mode==="order"){
    const w=full(it).split(" ").map((x,i)=>({x:x,i:i}));
    let b=shuffle(w),k=0;
    while(k<10&&w.length>1&&b.every((o,i)=>o.i===i)){b=shuffle(w);k++;}
    ses.bank=b;ses.ans=[];
  }
}
function tick(){
  if(!ses)return;
  ses.left--;
  const e=$("#tm");if(e)e.textContent=fmt(ses.left);
  if(ses.left<=0)finish();
}
function grade(it,ok,typed,irr){
  rec(it.id,ok,irr);
  const g=ok?(ses.hint?5:10):0;
  ses.xp+=g;S.xp+=g;
  if(ok)ses.ok++;else ses.bad.push({it:it,typed:typed});
  ses.good=ok;ses.checked=true;save();
}
function check(){
  if(!ses||ses.done||ses.flash)return;
  const it=ses.items[ses.i];if(!it||ses.checked)return;
  let ok=false,typed="";
  if(ses.mode==="fill"){
    const el=$("#ans");typed=el?el.value:"";
    if(!norm(typed))return;
    ses.val=typed;ok=it.a.some(a=>norm(a)===norm(typed));
  }else if(ses.mode==="order"){
    if(ses.ans.length!==ses.bank.length)return;
    typed=ses.ans.map(bi=>ses.bank[bi].x).join(" ");
    ok=typed===full(it);
  }else if(ses.mode==="irr"){
    const a=$("#a2"),b=$("#a3");
    ses.v2=a?a.value:"";ses.v3=b?b.value:"";
    if(!norm(ses.v2)||!norm(ses.v3))return;
    typed=norm(ses.v2)+" / "+norm(ses.v3);
    ok=it.v2.indexOf(norm(ses.v2))>-1&&it.v3.indexOf(norm(ses.v3))>-1;
  }else return;
  grade(it,ok,typed,ses.mode==="irr");
  if(ses.exam){next();return;}
  render();
}
function pickOpt(i){
  if(!ses||ses.mode!=="id"||ses.checked)return;
  const it=ses.items[ses.i];
  const chosen=ses.opts[i];
  ses.sel=i;
  grade(it,chosen===it.t,TM[chosen].vi,false);
  render();
}
function tok(i){
  if(!ses||ses.mode!=="order"||ses.checked)return;
  if(ses.ans.indexOf(i)<0)ses.ans.push(i);
  render();
}
function untok(p){
  if(!ses||ses.mode!=="order"||ses.checked)return;
  ses.ans.splice(p,1);render();
}
function next(){
  if(!ses)return;
  ses.i++;
  if(ses.i>=ses.items.length)return finish();
  prep();render();
}
function know(ok){
  if(!ses||!ses.flash)return;
  const it=ses.items[ses.i];
  if(ses.mode==="flashI")rec(it.id,ok,true);
  if(ok){ses.ok++;ses.xp+=2;S.xp+=2;ses.i++;}
  else{ses.items.push(ses.items.splice(ses.i,1)[0]);}
  ses.flip=false;save();
  if(ses.i>=ses.items.length)return finish();
  render();
}
function finish(){
  if(!ses)return;
  if(ses.timer){clearInterval(ses.timer);ses.timer=null;}
  ses.done=true;
  if(ses.exam){const sc=Math.round(ses.ok/ses.total*100)/10;if(sc>S.best)S.best=sc;save();}
  render();
}

function hdr(){
  const lv=Math.floor(S.xp/150)+1;
  const nav=[["home","Trang chủ"],["practice","Luyện tập"],["theory","Lý thuyết"],["verbs","Động từ"],["stats","Tiến độ"]];
  $("#hdr").innerHTML=`<div class="top"><div class="wrap"><div class="bar1"><div class="brand">Thì <em>Lab</em></div><div class="stats"><span>Lv ${lv}</span><span>${S.xp} XP</span><span>Chuỗi ${S.streak} ngày</span></div></div><nav>${nav.map(n=>`<button class="${!ses&&ui.view===n[0]?"on":""}" data-act="nav" data-v="${n[0]}">${n[1]}</button>`).join("")}</nav></div></div>`;
}
function render(){
  hdr();
  let h;
  if(ses)h=viewSession();
  else if(ui.view==="practice")h=viewPractice();
  else if(ui.view==="theory")h=viewTheory();
  else if(ui.view==="verbs")h=viewVerbs();

  if(ses&&!ses.done&&!ses.checked){
    const el=$("#ans")||$("#a2");
    if(el&&el.focus)setTimeout(()=>el.focus(),0);
  }
}

  return `<button class="cell t-${t.time}" data-act="tense" data-id="${t.id}"><span class="ring" style="--p:${p}"><span>${p}</span></span><b>${t.vi}</b><i>${t.en}</i></button>`;
}

  const done=S.day===dayKey(new Date())?S.today:0;
  const pct=Math.min(100,Math.round(done/20*100));
  const wr=S.wrong.length;
  return `<section class="hero"><h1>Nhớ 12 thì bằng cách làm, không phải đọc.</h1>
  <p>Điền chỗ trống, ghép câu, nhận diện thì và lật thẻ công thức. Câu nào sai sẽ quay lại cho đến khi bạn làm đúng hai lần liên tiếp.</p>

  <div class="map"><div class="colh t-past">Quá khứ</div><div class="colh t-present">Hiện tại</div><div class="colh t-future">Tương lai</div>${T.map(cell).join("")}</div>
  <p class="muted" style="margin-top:12px;font-size:14px">Chạm vào một ô để xem công thức. Vòng tròn là phần trăm câu bạn đã thuộc.</p>`;
}

function scopeChips(){
  const opts=T.map(t=>`<option value="${t.id}"${ui.scope===t.id?" selected":""}>${t.vi}</option>`).join("");
  const isT=!!TM[ui.scope];
  return `<div class="chips">${SCOPES.map(s=>`<button class="pill${ui.scope===s[0]?" on":""}" data-act="scope" data-v="${s[0]}">${s[1]}</button>`).join("")}<select class="pill${isT?" on":""}" id="scopeSel" aria-label="Chọn một thì"><option value="" disabled${isT?"":" selected"}>Một thì cụ thể</option>${opts}</select></div>`;
}
function lenChips(){
  return `<div class="chips">${[10,20,30].map(n=>`<button class="pill${ui.len===n?" on":""}" data-act="len" data-v="${n}">${n} câu</button>`).join("")}</div>`;
}
function viewPractice(){
  const wr=S.wrong.length;
  const n=scoped(ui.scope).length;
  return `<div class="stack"><div><h2>Luyện tập</h2><p class="muted">Phạm vi hiện tại có ${n} câu. Câu chưa thuộc được ưu tiên xuất hiện trước.</p></div>
  <div class="stack"><span class="label">Phạm vi</span>${scopeChips()}<span class="label">Số câu mỗi lượt</span>${lenChips()}</div>
  ${ui.msg?`<p class="notice">${esc(ui.msg)}</p>`:""}
  <div class="modes">
  <button class="mode" data-act="start" data-m="fill"><b>Điền chỗ trống</b><span>Gõ đúng dạng của động từ trong ngoặc. Có gợi ý công thức.</span></button>
  <button class="mode" data-act="start" data-m="id"><b>Nhận diện thì</b><span>Đọc câu, chọn đúng tên thì của động từ in đậm.</span></button>
  <button class="mode" data-act="start" data-m="order"><b>Sắp xếp câu</b><span>Chạm các từ theo đúng thứ tự để ghép câu hoàn chỉnh.</span></button>
  <button class="mode" data-act="start" data-m="flashT"><b>Thẻ công thức</b><span>Lật thẻ, tự chấm đã nhớ hay chưa. Thẻ chưa nhớ sẽ quay lại.</span></button>
  <button class="mode" data-act="start" data-m="exam"><b>Thi thử</b><span>20 câu điền chỗ trống trong 15 phút, chấm thang 10. Điểm cao nhất: ${S.best||"chưa có"}.</span></button>
  <button class="mode" data-act="start" data-m="review"><b>Ôn câu sai</b><span>${wr?"Đang có "+wr+" câu cần ôn.":"Chưa có câu sai nào."}</span></button>
  </div></div>`;
}

function viewTheory(){
  const t=TM[ui.tense];
  const chips=T.map(x=>`<button class="tchip t-${x.time}${x.id===t.id?" on":""}" data-act="tense" data-id="${x.id}">${x.vi}</button>`).join("");
  const lab=["+","-","?"];
  const rows=T.map(x=>`<tr><td><span class="chip t-${x.time}">${x.vi}</span></td><td class="m">${esc(x.f[0])}</td><td>${esc(x.sig.slice(0,4).join(", "))}</td></tr>`).join("");
  return `<div class="stack"><div><h2>Lý thuyết</h2><p class="muted">Chọn một thì để xem công thức, cách dùng và dấu hiệu nhận biết.</p></div>
  <div class="tchips">${chips}</div>
  <article class="panel t-${t.time}"><header><span>${t.en}</span><h2>${t.vi}</h2></header>
  <section><span class="label">Công thức</span><div class="formula">${t.f.map((f,i)=>`<i>${lab[i]}</i><span>${esc(f)}</span>`).join("")}</div></section>
  <section><span class="label">Cách dùng</span><ul>${t.use.map(u=>`<li>${esc(u)}</li>`).join("")}</ul></section>
  <section><span class="label">Dấu hiệu nhận biết</span><div class="sig">${t.sig.map(s=>`<span>${esc(s)}</span>`).join("")}</div></section>
  <section><span class="label">Ví dụ</span>${t.ex.map(e=>`<div class="ex"><b>${esc(e[0])}</b><small>${esc(e[1])}</small></div>`).join("")}</section>
  <section><div class="row"><button class="btn" data-act="practice" data-id="${t.id}">Luyện thì này</button><button class="btn ghost" data-act="start-t" data-id="${t.id}">Lật thẻ thì này</button></div></section></article>
  <h2 class="sec">Bảng tổng hợp 12 thì</h2>
  <div class="tablewrap"><table><thead><tr><th>Thì</th><th>Công thức</th><th>Dấu hiệu</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function irrRows(){
  const q=norm(ui.q);
  const l=IL.filter(v=>!q||v.v1.indexOf(q)>-1||norm(v.vi).indexOf(q)>-1);
  if(!l.length)return `<tr><td colspan="4" class="muted">Không tìm thấy động từ phù hợp.</td></tr>`;
  return l.map(v=>`<tr><td><span class="dot${mi(v)?" on":""}"></span><b>${v.v1}</b></td><td class="m">${v.v2.join(" / ")}</td><td class="m">${v.v3.join(" / ")}</td><td>${esc(v.vi)}</td></tr>`).join("");
}
function viewVerbs(){
  const k=IL.filter(mi).length;
  return `<div class="stack"><div><h2>Động từ bất quy tắc</h2><p class="muted">${IL.length} động từ hay gặp nhất. Bạn đã thuộc ${k}/${IL.length}. Chấm xanh là đã thuộc.</p></div>
  <div class="stack"><span class="label">Số động từ mỗi lượt</span>${lenChips()}</div>
  <div class="modes"><button class="mode" data-act="start" data-m="irr"><b>Gõ V2 và V3</b><span>Cho V1 và nghĩa, bạn gõ hai dạng còn lại.</span></button>
  <button class="mode" data-act="start" data-m="flashI"><b>Thẻ ghi nhớ</b><span>Lật thẻ để xem V2, V3 rồi tự chấm.</span></button></div>
  <h2 class="sec" style="margin:8px 0 0">Bảng tra cứu</h2>
  <input class="search" id="q" type="search" placeholder="Tìm theo động từ hoặc nghĩa" value="${esc(ui.q)}" autocomplete="off">
  <div class="tablewrap"><table><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Nghĩa</th></tr></thead><tbody id="irrbody">${irrRows()}</tbody></table></div></div>`;
}

function viewStats(){
  const acc=S.tot?Math.round(S.ok/S.tot*100):0;
  const bars=T.map(t=>{const p=mastery(t.id);return `<div class="barrow t-${t.time}"><span>${t.vi}</span><div class="prog"><i style="width:${p}%"></i></div><span class="mono">${p}%</span></div>`;}).join("");
  return `<div class="stack"><div><h2>Tiến độ</h2><p class="muted">Một câu được tính là đã thuộc khi bạn làm đúng hai lần liên tiếp.</p></div>
  <div class="nums"><div class="num"><b>${S.tot}</b><span>Câu đã làm</span></div><div class="num"><b>${acc}%</b><span>Tỷ lệ đúng</span></div><div class="num"><b>${S.streak}</b><span>Ngày liên tiếp</span></div><div class="num"><b>${S.wrong.length}</b><span>Câu cần ôn</span></div><div class="num"><b>${IL.filter(mi).length}/${IL.length}</b><span>Động từ đã thuộc</span></div><div class="num"><b>${S.best||"-"}</b><span>Điểm thi thử cao nhất</span></div></div>
  <h2 class="sec" style="margin:8px 0 0">Mức độ thuộc từng thì</h2><div class="bars">${bars}</div>
  <div>${ui.rs?`<p class="notice" style="margin-bottom:10px">Xóa toàn bộ tiến độ trên trình duyệt này?</p><div class="row"><button class="btn" data-act="resetYes">Xóa hết</button><button class="btn ghost" data-act="resetNo">Giữ lại</button></div>`:`<button class="btn ghost sm" data-act="reset">Xóa tiến độ</button>`}</div></div>`;
}

/* ===== màn hình phiên luyện ===== */
function feedback(it){
  if(ses.mode==="irr"){
    const ok=ses.good;
    return `<div class="fb ${ok?"good":"bad"}" role="status"><b>${ok?"Chính xác":"Chưa đúng"}</b><p class="full">${it.v1} - ${it.v2.join("/")} - ${it.v3.join("/")}</p></div>`;
  }
  const t=TM[it.t],ok=ses.good;
  return `<div class="fb ${ok?"good":"bad"}" role="status"><b>${ok?"Chính xác":"Chưa đúng"}${ok?"":` <span style="font-weight:500">Đáp án: <u>${esc(it.a.join(" / "))}</u></span>`}</b><p class="full">${esc(full(it))}</p><div class="why"><span class="chip t-${t.time}">${t.vi}</span><code>${esc(t.f[0])}</code></div>${speakBtn(full(it))}</div>`;
}
function hintBox(it){
  if(!ses.hint)return "";
  if(ses.mode==="irr")return `<p class="hint">V2 bắt đầu bằng "${esc(it.v2[0][0])}", V3 bắt đầu bằng "${esc(it.v3[0][0])}".</p>`;
  const t=TM[it.t];
  return `<p class="hint">Dùng <b>${t.vi}</b>: <code>${esc(t.f[0])}</code></p>`;
}
function viewSession(){
  const s=ses;
  if(s.done)return resultView();
  const it=s.items[s.i];
  const cur=s.flash?s.ok:s.i;
  const prog=Math.round(cur/s.total*100);
  const top=`<div class="sbar"><button class="btn ghost sm" data-act="exit">Thoát</button><div class="prog"><i style="width:${prog}%"></i></div><span class="mono">${s.flash?s.ok+"/"+s.total+" thẻ":(s.i+1)+"/"+s.total}</span>${s.exam?`<span class="timer mono" id="tm">${fmt(s.left)}</span>`:""}</div>`;
  let body="";
  const last=s.i>=s.items.length-1;
  const nextBtn=`<button class="btn" data-act="next">${last?"Xem kết quả":"Câu tiếp theo"}</button>`;
  if(s.mode==="fill"){
    const parts=it.s.split("___");
    const right=esc(parts[1]).replace(/\(([^)]+)\)/,'<span class="cue">($1)</span>');
    const w=Math.max.apply(null,it.a.map(a=>a.length))+2;
    const cls=s.checked?(s.good?"ok":"bad"):"";
    body=`<div class="qcard"><span class="label">${s.exam?"Thi thử":"Điền dạng đúng của động từ"}</span>
    <p class="sentence">${esc(parts[0])}<input class="blank ${cls}" id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" style="width:${w}ch" value="${esc(s.val)}"${s.checked?" disabled":""} aria-label="Đáp án">${right}</p>
    ${hintBox(it)}${s.checked?feedback(it):""}
    <div class="row">${s.checked?nextBtn:`<button class="btn" data-act="check">${s.exam?"Lưu và tiếp tục":"Kiểm tra"}</button>${s.exam?"":`<button class="btn ghost" data-act="hint">Gợi ý</button>`}`}</div></div>`;
  }else if(s.mode==="id"){
    const t=TM[it.t];
    const sent=esc(it.s.replace(/\s*\([^)]*\)/,"")).replace("___",`<b class="hl">${esc(it.a[0])}</b>`);
    const opts=s.opts.map((id,i)=>{
      let c="opt";
      if(s.checked){if(id===it.t)c+=" good";else if(i===s.sel)c+=" bad";}
      return `<button class="${c}" data-act="opt" data-i="${i}"${s.checked?" disabled":""}>${TM[id].vi}</button>`;
    }).join("");
    body=`<div class="qcard t-${t.time}"><span class="label">Động từ in đậm đang ở thì nào?</span><p class="sentence">${sent}</p><div class="opts">${opts}</div>${s.checked?feedback(it)+`<div class="row">${nextBtn}</div>`:""}</div>`;
  }else if(s.mode==="order"){
    const used=s.ans;
    const tray=used.map((bi,p)=>`<button class="tok" data-act="untok" data-i="${p}"${s.checked?" disabled":""}>${esc(s.bank[bi].x)}</button>`).join("");
    const bank=s.bank.map((o,i)=>used.indexOf(i)<0?`<button class="tok alt" data-act="tok" data-i="${i}"${s.checked?" disabled":""}>${esc(o.x)}</button>`:"").join("");
    body=`<div class="qcard"><span class="label">Ghép thành câu đúng</span>
    <div class="tray" aria-label="Câu của bạn">${tray||'<span class="muted">Chạm vào các từ bên dưới</span>'}</div>
    <div class="row">${bank}</div>${hintBox(it)}${s.checked?feedback(it):""}
    <div class="row">${s.checked?nextBtn:`<button class="btn" data-act="check"${used.length===s.bank.length?"":" disabled"}>Kiểm tra</button><button class="btn ghost" data-act="hint">Gợi ý</button>`}</div></div>`;
  }else if(s.mode==="irr"){
    const c2=s.checked?(it.v2.indexOf(norm(s.v2))>-1?"ok":"bad"):"";
    const c3=s.checked?(it.v3.indexOf(norm(s.v3))>-1?"ok":"bad"):"";
    body=`<div class="qcard"><span class="label">Điền V2 và V3</span>
    <div class="irr"><div class="v1"><b>${it.v1}</b><span>${esc(it.vi)}</span></div>
    <label>V2 (quá khứ)<input id="a2" class="${c2}" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(s.v2)}"${s.checked?" disabled":""}></label>
    <label>V3 (quá khứ phân từ)<input id="a3" class="${c3}" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="${esc(s.v3)}"${s.checked?" disabled":""}></label></div>
    ${hintBox(it)}${s.checked?feedback(it):""}
    <div class="row">${s.checked?nextBtn:`<button class="btn" data-act="check">Kiểm tra</button><button class="btn ghost" data-act="hint">Gợi ý</button>`}</div></div>`;
  }else if(s.mode==="flashT"){
    const t=it;
    const front=`<span class="label">Thì nào có công thức này?</span><h2>${t.vi}</h2><p class="muted">${t.en}</p><p class="muted" style="font-size:14px">Chạm để lật thẻ</p>`;
    const back=`<span class="chip t-${t.time}" style="justify-self:start">${t.vi}</span><div class="stack" style="gap:8px">${t.f.map((f,i)=>`<div class="f">${["+","-","?"][i]} ${esc(f)}</div>`).join("")}</div><ul>${t.use.map(u=>`<li>${esc(u)}</li>`).join("")}</ul><div class="sig">${t.sig.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
    body=`<button class="flash t-${t.time}" data-act="flip" aria-label="Lật thẻ">${s.flip?back:front}</button>${s.flip?`<div class="row"><button class="btn ghost" data-act="again">Chưa nhớ</button><button class="btn" data-act="know">Đã nhớ</button></div>`:""}`;
  }else if(s.mode==="flashI"){
    const front=`<span class="label">${esc(it.vi)}</span><h2>${it.v1}</h2><p class="muted" style="font-size:14px">Chạm để xem V2 và V3</p>`;
    const back=`<span class="label">${it.v1} - ${esc(it.vi)}</span><h2>${it.v2.join(" / ")}</h2><h2 class="muted">${it.v3.join(" / ")}</h2>`;
    body=`<button class="flash" data-act="flip" aria-label="Lật thẻ">${s.flip?back:front}</button>${s.flip?`<div class="row"><button class="btn ghost" data-act="again">Chưa nhớ</button><button class="btn" data-act="know">Đã nhớ</button></div>`:""}`;
  }
  return top+`<div class="stack">${body}</div>`;
}
function resultView(){
  const s=ses,n=s.total||1;
  if(s.flash){
    return `<div class="stack"><span class="label">Hoàn thành</span><p class="score">${s.ok}/${s.total}</p><p>Bạn đã nhớ hết các thẻ trong lượt này. +${s.xp} XP.</p><div class="row"><button class="btn" data-act="start" data-m="${s.src}">Học lượt mới</button><button class="btn ghost" data-act="exit">Về trang trước</button></div></div>`;
  }
  const pct=Math.round(s.ok/n*100);
  const grade10=Math.round(s.ok/n*100)/10;
  const msg=pct>=90?"Rất vững. Bạn có thể thử phạm vi khó hơn.":pct>=70?"Khá tốt. Xem lại các câu sai bên dưới rồi làm thêm một lượt.":"Cần ôn thêm. Đọc lại công thức ở tab Lý thuyết rồi luyện lại.";
  const skipped=s.exam?s.total-s.ok-s.bad.length:0;
  const wrongs=s.bad.map(b=>{
    const it=b.it;
    if(s.mode==="irr")return `<div class="item"><b>${it.v1} - ${it.v2.join("/")} - ${it.v3.join("/")}</b><small>Bạn trả lời: ${esc(b.typed)}</small></div>`;
    return `<div class="item"><b>${esc(full(it))}</b><small>Bạn trả lời: ${esc(b.typed)} · ${TM[it.t].vi}</small></div>`;
  }).join("");
  return `<div class="stack"><span class="label">${s.exam?"Kết quả thi thử":"Kết quả"}</span>
  <p class="score">${s.exam?grade10+"/10":s.ok+"/"+s.total}</p><p>${pct}% đúng. ${msg} +${s.xp} XP.</p>
  ${skipped>0?`<p class="muted">Chưa làm: ${skipped} câu do hết giờ.</p>`:""}
  <div class="row"><button class="btn" data-act="start" data-m="${s.src}">Làm lượt mới</button>${s.bad.length&&!s.exam?`<button class="btn ghost" data-act="start" data-m="review">Ôn câu sai</button>`:""}<button class="btn ghost" data-act="exit">Về trang trước</button></div>
  ${wrongs?`<h2 class="sec" style="margin:8px 0 0">Câu cần xem lại</h2><div class="list">${wrongs}</div>`:`<p class="notice">Không có câu nào sai.</p>`}</div>`;
}

/* ===== sự kiện ===== */
function act(a,d){
  switch(a){
    case "nav":exit();ui.view=d.v;ui.msg="";render();window.scrollTo(0,0);break;
    case "tense":exit();ui.tense=d.id;ui.view="theory";render();window.scrollTo(0,0);break;
    case "scope":ui.scope=d.v;render();break;
    case "len":ui.len=+d.v;render();break;
    case "start":startSes(d.m);window.scrollTo(0,0);break;
    case "start-t":ui.scope=d.id;startSes("flashT");window.scrollTo(0,0);break;
    case "exit":exit();render();break;
    case "check":check();break;
    case "next":next();break;
    case "hint":{const el=$("#ans");if(el)ses.val=el.value;const a2=$("#a2"),a3=$("#a3");if(a2){ses.v2=a2.value;ses.v3=a3?a3.value:"";}ses.hint=true;render();break;}
    case "opt":pickOpt(+d.i);break;
    case "tok":tok(+d.i);break;
    case "untok":untok(+d.i);break;
    case "flip":ses.flip=!ses.flip;render();break;
    case "know":know(true);break;
    case "again":know(false);break;
    case "speak":speak(d.t);break;
    case "reset":ui.rs=true;render();break;
    case "resetYes":S=fresh();save();ui.rs=false;render();break;
    case "resetNo":ui.rs=false;render();break;
    case "practice":ui.scope=d.id;ui.view="practice";render();window.scrollTo(0,0);break;
  }
}
if(typeof document!=="undefined"&&document.addEventListener){
  document.addEventListener("click",e=>{
    const b=e.target.closest&&e.target.closest("[data-act]");
    if(b)act(b.dataset.act,b.dataset);
  });
  document.addEventListener("change",e=>{
    if(e.target.id==="scopeSel"){ui.scope=e.target.value;render();}
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="q"){ui.q=e.target.value;const tb=$("#irrbody");if(tb)tb.innerHTML=irrRows();}
  });
  document.addEventListener("keydown",e=>{
    if(e.key!=="Enter"||!ses||ses.done||ses.flash)return;
    const tg=e.target;
    if(tg&&tg.tagName==="BUTTON")return;
    e.preventDefault();
    if(tg&&tg.id==="a2"&&!ses.checked){const b=$("#a3");if(b)b.focus();return;}
    if(ses.checked)next();else check();
  });
  load();render();
}
</script>
</body>
</html>
